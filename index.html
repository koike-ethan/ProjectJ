<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店舗一覧</title>
<style>
:root{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#222}
main{max-width:760px;margin:0 auto;padding:40px 20px 56px}
h1{margin:0 0 12px;font-size:32px;line-height:1.2}
p{margin:0 0 24px;color:#667085}
ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
li a, li span{display:block;padding:16px 18px;border:1px solid #d9dee7;border-radius:10px;background:#fff;text-decoration:none;color:inherit;font-size:18px;font-weight:700}
li small{display:block;margin-top:6px;color:#667085;font-size:13px;font-weight:400}
.disabled{opacity:.65}
.breadcrumbs{margin:0 0 16px;color:#667085;font-size:13px}
.breadcrumbs ol{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0;gap:0}
.breadcrumbs li{display:flex;align-items:center}
.breadcrumbs li+li::before{content:"/";margin:0 8px;color:#98a2b3}
.breadcrumbs [aria-current="page"]{font-weight:700;color:#111827}
</style>
</head>
<body>
<main>
  <nav class="breadcrumbs" aria-label="breadcrumb">
    <ol>
      <li><span aria-current="page">店舗一覧</span></li>
    </ol>
  </nav>
  <h1>店舗一覧</h1>
  <p>調査対象の店舗を選んでください。</p>
  <ul>
    <li><a href="kj/">某K.J.<small>現在の台データレポート</small></a></li>
    <li><a href="kk/">某K.K.<small>現在の台データレポート</small></a></li>
    <li><a href="ia/">某I.A.<small>現在の台データレポート</small></a></li>
  </ul>
</main>
</body>
</html>
